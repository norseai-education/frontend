version: '3.8'

services:
  app:
    build: .
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    restart: unless-stopped
    networks:
      - frontend-network

networks:
  frontend-network:
    external: true

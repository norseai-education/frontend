version: "3.8"
services:
  norseai-frontend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: dev-frontend-norseai-frontend      
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - traefik-public
      - norseai
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.norseai.rule=Host(`norseai.sunshinek12.com`)"
      - "traefik.http.routers.norseai.entrypoints=websecure"
      - "traefik.http.routers.norseai.tls=true"
      - "traefik.http.routers.norseai.tls.certresolver=letsencrypt"
      - "traefik.http.services.norseai.loadbalancer.server.port=5173"
    environment:
      - BACKEND_URL=http://dev-backend:6700  # Internal HTTP communication
      - NODE_ENV=production
    # Optional: build from GitHub
    # build:
    #   context: .
    #   dockerfile: Dockerfile.frontend

networks:
  traefik-public:
    external: true
  norseai:
    external: true  # Same network as backend
    
